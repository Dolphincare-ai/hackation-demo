<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNF Operating Layer</title>
<style>
:root{--bg:#0b1220;--panel:#131c2e;--line:#26324a;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--good:#34d399;--warn:#fbbf24}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif}
.slide{position:absolute;inset:0;padding:6vh 7vw;display:none;flex-direction:column}
.slide.on{display:flex}
.kicker{color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-size:1.6vh;font-weight:700;margin-bottom:1.5vh}
h1{font-size:5.2vh;margin:0 0 4vh;line-height:1.15;font-weight:700}
.t-title h1{font-size:9vh;margin-top:22vh}.t-title .sub{font-size:3vh;color:var(--muted);max-width:70vw;line-height:1.4}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:3vh}
ul{margin:0;padding:0;list-style:none}li{font-size:3.6vh;line-height:1.4;margin:0 0 3.6vh;padding-left:2.6vw;position:relative}
li:before{content:"";position:absolute;left:0;top:1.7vh;width:1.2vh;height:1.2vh;border-radius:50%;background:var(--accent)}
.grid{display:grid;gap:2vw}
.card{background:var(--panel);border:1px solid var(--line);border-radius:1.4vh;padding:3vh 1.6vw}
.card h3{margin:0 0 1.5vh;font-size:2.7vh;color:var(--accent)}.card p,.card li{font-size:2.3vh;color:var(--text);line-height:1.4;margin:0 0 1vh}
.card li{padding-left:1.4vw}.card li:before{width:.7vh;height:.7vh;top:1.1vh}
.cards .card{min-height:46vh;padding:5vh 2vw;border-top:.6vh solid var(--accent)}
.cards .card h3{font-size:3.6vh;margin-bottom:3vh}.cards .card p{font-size:3vh;line-height:1.5}
.flow{display:flex;flex-wrap:nowrap;align-items:center}
.step{background:var(--panel);border:1px solid var(--line);border-top:.6vh solid var(--accent);border-radius:1vh;padding:3vh .8vw;font-size:2.7vh;flex:1;min-width:0;text-align:center;min-height:34vh;display:flex;align-items:center;justify-content:center;line-height:1.35}
.step b{display:block;color:var(--accent);font-size:4.5vh;margin-bottom:1.5vh}.arrow{color:var(--accent);font-size:4vh;padding:0 .3vw}
.footer{color:var(--muted);font-size:2vh;border-top:1px solid var(--line);padding-top:2vh}
.stat{text-align:center;padding:5vh 1vw}.stat .v{font-size:8vh;font-weight:800;color:var(--accent)}.stat .l{font-size:2.2vh;color:var(--muted);margin-top:1vh}
table{border-collapse:collapse;width:100%;font-size:2.2vh}th{color:var(--accent);text-align:left;font-size:1.8vh;text-transform:uppercase;letter-spacing:.08em}
th,td{padding:1.6vh 1vw;border-bottom:1px solid var(--line);vertical-align:top}
.t-demo h1{font-size:4.4vh}.big{font-size:14vh;font-weight:800;color:var(--accent);margin:2vh 0}
.backup .kicker{color:var(--warn)}
#bar{position:fixed;bottom:1.5vh;right:2vw;color:var(--muted);font-size:1.6vh;z-index:5}
#notes{position:fixed;left:0;right:0;bottom:0;background:#000d;padding:2vh 7vw 5vh;font-size:2.2vh;line-height:1.5;display:none;z-index:4;border-top:2px solid var(--accent)}
#notes.on{display:block}#notes b{color:var(--accent)}
@media print{@page{size:landscape}.slide{display:flex!important;position:relative;height:100vh;page-break-after:always}#bar,#notes{display:none!important}}
</style></head><body>
<div id="deck"></div><div id="notes"></div>
<div id="bar"></div>
<script>
const D = {"title": "SNF Operating Layer", "slides": [{"type": "title", "seconds": 15, "kicker": "Sinium hackathon · Ruchy & Yaeli", "title": "One email in. Closed out.", "subtitle": "An operating layer that connects a nursing home's existing systems and turns each event into tracked work, starting with vendor invoices.", "notes": "Hi, we're Ruchy and Yaeli. We built an operating layer for skilled nursing facilities. It doesn't replace any of their software. It sits on top, connects the dots, and drives the work to done. Our first scenario is the vendor invoice audit, and you'll see it live in a minute."}, {"type": "bullets", "seconds": 40, "kicker": "The problem", "title": "Software fatigue, and money leaking between the systems", "bullets": ["A building runs on many disconnected tools: EHR (census), AP inbox, vendor contracts, delivery logs, bank, Teams", "Nobody cross-checks them, so a pharmacy can bill above contract, bill after a resident was discharged, or bill for items never delivered", "Changed bank details on an invoice is a classic payment-fraud route", "Every wait (approval, manual check, low funds) lives in someone's head or inbox, and nothing escalates when it stalls"], "notes": "From the operator calls: nursing homes have plenty of software but nothing pulling it together. Take one invoice. To check it properly, someone has to open the contract, the delivery log, the census in the EHR and the bank. Nobody has time, so invoices get paid as billed. In our sample invoice, 600 dollars out of 4,010 shouldn't be paid, which is about 15 percent. Multiply that by every vendor and every building."}, {"type": "cards", "seconds": 25, "kicker": "Who it's for", "title": "Built for the top, useful all the way down", "cards": [{"head": "Owner / corporate (≈10 homes)", "body": "Portfolio dashboard: every building ranked worst-first, money at risk, what needs the owner."}, {"head": "Administrator (one building)", "body": "Building board: what's late, what's waiting on me, what's due in 24h."}, {"head": "BOM · DON · CFO", "body": "Get their task in the tool they already use: email, Teams, EHR alert. Nothing new to learn."}], "notes": "Our client is at the top, either an owner or a corporate with about ten homes. They get the portfolio view. The administrator gets one building. Staff below them keep working where they already work, and the platform just sends them the right task at the right time."}, {"type": "cards", "seconds": 35, "kicker": "Our idea", "title": "An operating layer, not another app", "cards": [{"head": "Every wait is a task", "body": "With an owner, a due time and an escalation ladder. Approvals, checks, funds, payments: one engine."}, {"head": "Never moves money", "body": "It creates a payment task for a person, then watches the bank feed to confirm."}, {"head": "A person approves", "body": "Checks are plain code. AI reads and writes text; it never decides pass or fail."}, {"head": "Everything audited", "body": "Every check, AI call, task, alert and approval is logged and reproducible."}], "notes": "Four principles. First, every wait becomes a task with a deadline and an escalation path, so nothing stalls silently. Second, we never touch money. A person pays, and we observe it. Third, a human approves, and the checks are deterministic code, not AI guesses. Fourth, everything is audited. That's what makes an owner comfortable letting a bot run."}, {"type": "flow", "seconds": 30, "kicker": "Scenario 1: vendor invoice audit", "title": "From email to closed, with nobody chasing it", "steps": ["Invoice email arrives", "AI reads it", "6 automatic checks", "Manual check for gaps", "Approval packet", "Funds check", "Payment task", "Bank feed match", "Reply & close"], "footer": "Checks: price vs contract · dates vs census · delivery records · math · duplicates · bank details vs vendor master", "notes": "This is the flow you're about to see. The email comes in and AI extracts the lines. Six code checks run against the contract, the census, the delivery log and the vendor master. Anything we can't verify becomes a manual check for the right person. Then an approval packet, a funds check against a reserve, a payment task, and when the payment shows on the bank feed we close it and reply to the vendor on the original thread. If anything waits too long, backup alerts fire."}, {"type": "demo", "seconds": 240, "kicker": "Live demo", "title": "Harbor Pharmacy invoice #4471 · Riverside Care", "bullets": ["Portfolio dashboard → one building", "Invoice arrives → checks catch $600", "DON verifies the missing delivery", "Administrator approves line by line → $3,410 payable", "Payment posts on the bank → task closes, vendor gets a reply", "Ask the agent: \"what's late?\" / change a rule with confirmation"], "notes": "Follow presentation/demo_script.md. Keep it to four minutes. If anything breaks, go to the backup slides at the end."}, {"type": "bullets", "seconds": 25, "kicker": "Trust", "title": "Where AI is trusted, and where it isn't", "bullets": ["AI reads emails and writes text. Plain code decides every pass/fail", "Every AI answer is schema-validated, retried once, then falls back (manual-entry task or a text template)", "The chat agent can only propose. A person must confirm in a later message, with role permissions checked by the server", "There is no transfer, approve or resolve tool, so the AI cannot move money even if asked"], "notes": "This is what an owner worries about. We use AI where it's strong, reading messy emails and writing polite replies, and keep it out of decisions. The chat can suggest changing a rule, but the server refuses to apply it until a person with the right role confirms. And there is simply no tool for moving money."}, {"type": "stats", "seconds": 25, "kicker": "Development time with AI", "title": "Built in 10 hours, not months", "stats": [{"value": "≈10 h", "label": "core build, 2 people, each pairing with Claude Code"}, {"value": "18", "label": "commits over the hackathon"}, {"value": "≈5,600", "label": "lines of Python + React"}, {"value": "82", "label": "automated tests"}], "footer": "Next scenario (resident fall): about a day. It's a new handler in workflows/registry.py, reusing the same task engine, ladders, audit and UI.", "notes": "We split it into two lanes, engine and connectors/UI, wrote the contract first in CLAUDE.md, and each of us drove a Claude Code session. The core end to end took about ten hours, and we added the chat agent and real email on top. Because the engine is generic, the next workflow is mostly configuration and a handler."}, {"type": "bullets", "seconds": 25, "kicker": "Onboarding", "title": "No training needed", "bullets": ["Staff enter nothing into the platform. It reads the systems they already use", "Tasks arrive where people already work (inbox, Teams, EHR), with plain-language titles", "Each role lands on its own view: owner gets the portfolio, administrator gets their building", "Ask the agent in plain English: \"What's late?\", \"Why was line 3 flagged?\""], "notes": "Onboarding is basically zero. There are no setup screens and no data entry. The DON gets one email that says 'please confirm the enoxaparin delivery', and that's the whole interaction."}, {"type": "bullets", "seconds": 25, "kicker": "Robust for support", "title": "Easy to support, hard to break", "bullets": ["Full audit trail: every state change, AI call, notification and approval, with the evidence that was compared", "Idempotent bot loop: running it twice changes nothing, so restarts are safe", "AI outage? Falls back to templates and manual tasks. Offline cache mode for demos", "Rule changes are schema-validated, audited before and after, and revertible ('restore defaults')", "Connector health endpoint · injectable clock for testing escalations · table-driven tests"], "notes": "When a customer calls support asking why an invoice was held, the timeline answers it, with the exact contract row and census row we compared. Nothing depends on the AI being up."}, {"type": "bullets", "seconds": 20, "kicker": "Next", "title": "Roadmap & ask", "bullets": ["Next workflows on the same engine: resident fall, admissions paperwork, staffing gaps", "Real connectors: PointClickCare census, bank feed, Teams", "Ask: a pilot on one building's AP inbox, then roll out to the portfolio"], "notes": "Thank you. The engine is built so each new workflow is a handler plus a playbook. We'd love a pilot on one building's real AP inbox. Happy to take questions."}, {"type": "table", "seconds": 0, "backup": true, "kicker": "Backup · seed invoice", "title": "Harbor Pharmacy #4471: $4,010 billed, $3,410 payable", "header": ["Line", "Billed", "Planted issue", "Result"], "rows": [["Metformin 500 mg", "900 × 0.09 = $81", "matches", "verified"], ["Lisinopril 10 mg", "700 × 0.11 = $77", "matches", "verified"], ["Atorvastatin 40 mg", "600 × 0.84 = $504", "contract rate 0.52", "price failed, $192 at risk → pay at contract $312"], ["Apixaban 5 mg (J. Alvarez)", "60 × 6.80 = $408", "resident discharged 10/21", "date failed, $408 → excluded"], ["Enoxaparin 40 mg", "120 × 24.50 = $2,940", "no delivery record", "unverified → DON manual check"]], "footer": "Balance $12,000 − payable $3,410 ≥ reserve $5,000 → funds pass. Set balance to $6,000 → CFO gets a $2,410 shortfall task.", "notes": "Use if the live demo fails, or to answer 'what exactly was checked?'"}, {"type": "bullets", "seconds": 0, "backup": true, "kicker": "Backup · other branches", "title": "What else the engine handles", "bullets": ["Changed bank details (template harbor_changed_bank): bank_details check fails and the packet flags possible payment fraud", "Low funds: FUNDS_INSUFFICIENT, CFO task, retried every tick, continues automatically when the balance recovers", "Approval not given in 24h: reminder; at 48h: alert to owner / backup approver", "Payment past due: alert to BOM and administrator · wrong amount on the bank feed: marked mismatch, run stays open", "Rejected: vendor notified with the dispute, run closed"], "notes": "Each of these is covered by an automated test in backend/tests/test_flow.py."}]};
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ul = xs => "<ul>" + xs.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
const foot = s => s.footer ? `<div class="footer">${esc(s.footer)}</div>` : "";
const page = (s, inner) => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="body">${inner}</div>${foot(s)}`;
const cols = n => `style="grid-template-columns:repeat(${n},1fr)"`;
const R = {
  title: s => `<div class="kicker">${esc(s.kicker)}</div><h1>${esc(s.title)}</h1><div class="sub">${esc(s.subtitle)}</div>`,
  bullets: s => page(s, ul(s.bullets)),
  cards: s => page(s, `<div class="grid cards" ${cols(s.cards.length)}>` +
    s.cards.map(c => `<div class="card"><h3>${esc(c.head)}</h3><p>${esc(c.body)}</p></div>`).join("") + `</div>`),
  flow: s => page(s, `<div class="flow">` +
    s.steps.map((x, i) => `<div class="step"><div><b>${i + 1}</b>${esc(x)}</div></div>`).join('<span class="arrow">›</span>') + `</div>`),
  arch: s => page(s, `<div class="grid" ${cols(s.columns.length)}>` +
    s.columns.map(c => `<div class="card"><h3>${esc(c.head)}</h3>${ul(c.items)}</div>`).join("") + `</div>`),
  stats: s => page(s, `<div class="grid" ${cols(s.stats.length)}>` +
    s.stats.map(x => `<div class="card stat"><div class="v">${esc(x.value)}</div><div class="l">${esc(x.label)}</div></div>`).join("") + `</div>`),
  table: s => page(s, `<table><tr>${s.header.map(h => `<th>${esc(h)}</th>`).join("")}</tr>` +
    s.rows.map(r => "<tr>" + r.map(c => `<td>${esc(c)}</td>`).join("") + "</tr>").join("") + `</table>`),
  demo: s => `<div class="kicker">${esc(s.kicker)}</div><div class="big">Live demo</div><h1>${esc(s.title)}</h1>${ul(s.bullets)}`,
};
const deck = document.getElementById("deck");
D.slides.forEach(s => { const el = document.createElement("section");
  el.className = `slide t-${s.type}${s.backup ? " backup" : ""}`; el.innerHTML = R[s.type](s); deck.appendChild(el); });
const els = [...document.querySelectorAll(".slide")], notes = document.getElementById("notes"), bar = document.getElementById("bar");
let i = Math.max(0, Math.min(els.length - 1, (parseInt(location.hash.slice(1)) || 1) - 1));
const fmt = t => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
const total = D.slides.reduce((a, s) => a + s.seconds, 0);
function show() {
  els.forEach((e, k) => e.classList.toggle("on", k === i));
  const s = D.slides[i], at = D.slides.slice(0, i).reduce((a, x) => a + x.seconds, 0);
  notes.innerHTML = `<b>Notes (${s.seconds ? fmt(s.seconds) : "backup"}):</b> ${esc(s.notes || "")}`;
  bar.textContent = `${i + 1} / ${els.length} · ${s.backup ? "backup" : "at " + fmt(at) + " of " + fmt(total)} · N = notes`;
  history.replaceState(null, "", "#" + (i + 1));
}
document.addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) i = Math.min(els.length - 1, i + 1);
  else if (["ArrowLeft", "PageUp"].includes(e.key)) i = Math.max(0, i - 1);
  else if (e.key.toLowerCase() === "n") notes.classList.toggle("on");
  else if (e.key === "Home") i = 0; else return;
  e.preventDefault(); show();
});
deck.addEventListener("click", e => { i = e.clientX > innerWidth / 3 ? Math.min(els.length - 1, i + 1) : Math.max(0, i - 1); show(); });
show();
</script></body></html>
